<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Received | Fly Visuals</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F4F4}
a{color:#111111}a:hover{color:#0A0A0A}
</style>
</helmet>
<div style="font-family: 'Open Sans', system-ui, sans-serif; color: #1A1A1A; background: #F4F4F4">
<dc-import name="Header" active="none" hint-size="100%,132px"></dc-import>
<section style="padding: 64px 24px 96px">
<div style="max-width: 720px; margin: 0 auto; background: #FFFFFF; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.10); padding: 40px; display: flex; flex-direction: column; gap: 18px">
<span style="width: 64px; height: 64px; border-radius: 50%; background: #E8F3EC; display: flex; align-items: center; justify-content: center"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1E7A44" stroke-width="2.5" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg></span>
<h1 style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: clamp(28px, 4vw, 38px); font-weight: 800; color: #111111">Thanks! Your order is paid.</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3A3A3A">Stripe emailed your receipt. Next, send us your artwork or logo below. We'll email a proof before we print anything.</p>
<form name="artwork" method="POST" action="/thanks/" enctype="multipart/form-data" data-netlify="true" netlify-honeypot="bot-field" style="display: flex; flex-direction: column; gap: 16px">
<input type="hidden" name="form-name" value="artwork">
<p hidden><label>Leave this empty <input name="bot-field"></label></p>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #111111">Order number<input name="order" type="text" required style="font: inherit; font-weight: 400; font-size: 16px; padding: 12px; border: 1px solid #BEBEBE; border-radius: 4px; min-height: 48px; box-sizing: border-box"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #111111">Email<input name="email" type="email" autocomplete="email" required style="font: inherit; font-weight: 400; font-size: 16px; padding: 12px; border: 1px solid #BEBEBE; border-radius: 4px; min-height: 48px; box-sizing: border-box"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #111111">Artwork or logo (PDF, AI, EPS, PNG or JPG, up to 8 MB)<input name="artwork" type="file" accept=".pdf,.ai,.eps,.svg,.png,.jpg,.jpeg" style="font: inherit; font-weight: 400; font-size: 15px"></label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700; color: #111111"><span>Notes <span style="font-weight: 400; color: #555555">(text, colors, deadline)</span></span><textarea name="notes" rows="4" style="font: inherit; font-weight: 400; font-size: 16px; padding: 12px; border: 1px solid #BEBEBE; border-radius: 4px; resize: vertical"></textarea></label>
<button type="submit" style="background: #DC1A21; color: #FFFFFF; border: none; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 17px; min-height: 54px; cursor: pointer">Send My Artwork</button>
</form>
<p style="margin: 0; font-size: 15px; color: #555555">Don't have artwork yet? No problem. Reply to your receipt email or call <a href="tel:7274946162" style="font-weight: 700">(727) 494-6162</a> and we'll design it with you.</p>
</div>
</section>
<dc-import name="Footer" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1800}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
