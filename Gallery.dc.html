      list: shown.map(function (g, i) { return { t: g.t, c: g.c[0], src: B + g.p[0].i, multi: g.p.length > 1, count: g.p.length + ' photos', open: function () { self.setState({ open: i, p: 0 }); } }; }),
      countTxt: n + ' projects · ' + photos + ' photos',
      hasOpen: !!job, cur: job ? { t: job.t, src: B + photo.i, a: photo.a } : { t: '', src: '', a: '' },
      pos: job && job.p.length > 1 ? 'Photo ' + (Math.min(pi, job.p.length - 1) + 1) + ' of ' + job.p.length : '',
      hasThumbs: !!job && job.p.length > 1,
      thumbs: job ? job.p.map(function (p, k) { var on = k === pi; return { src: B + p.i, a: p.a, label: 'Show photo ' + (k + 1), style: 'padding: 0; width: 64px; height: 48px; border-radius: 4px; overflow: hidden; cursor: pointer; background: none; border: 2px solid ' + (on ? '#FFFFFF' : 'transparent') + '; opacity: ' + (on ? '1' : '0.6'), pick: function () { self.setState({ p: k }); } }; }) : [],
      close: function () { self.setState({ open: -1, p: 0 }); },
      prev: function () { step(-1); },
      next: function () { step(1); }
    };
  }
}
</script>
</body>
</html>
