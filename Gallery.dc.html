<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&amp;family=Open+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF}
a{color:#111111}a:hover{color:#0A0A0A}
</style>
</helmet>
<div style="font-family: 'Open Sans', system-ui, sans-serif; color: #1A1A1A; background: #FFFFFF">
<dc-import name="Header" active="gallery" hint-size="100%,132px"></dc-import>

<section style="background: #111111; color: #FFFFFF; padding: 64px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">
<nav aria-label="Breadcrumb" style="font-size: 14px; display: flex; gap: 8px"><a href="index.html" style="color: #D4D4D4">Home</a><span aria-hidden="true">/</span><span>Gallery</span></nav>
<h1 style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: clamp(36px, 4.4vw, 54px); font-weight: 800">Our work</h1>
<p style="margin: 0; font-size: 19px; line-height: 1.6; color: #D4D4D4; max-width: 720px">Real jobs from our Port Richey shop: wraps, boats, signs, window graphics and tint for businesses across Tampa Bay.</p>
</div>
</section>

<section style="background: #F4F4F4; padding: 48px 24px 88px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<div role="group" aria-label="Filter by type" style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
<span style="font-size: 15px; color: #555555">{{countTxt}}</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 270px), 1fr)); gap: 16px">
<sc-for list="{{list}}" as="g" hint-placeholder-count="12">
<button type="button" onClick="{{g.open}}" aria-label="View larger: {{g.t}}" style="padding: 0; border: none; background: #FFFFFF; border-radius: 6px; overflow: hidden; cursor: pointer; text-align: left; font: inherit; display: flex; flex-direction: column">
<img src="{{g.src}}" alt="{{g.t}}" style="width: 100%; aspect-ratio: 4 / 3; object-fit: cover; display: block">
<span style="padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #DC1A21">{{g.c}}</span>
<span style="font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 15px; color: #111111">{{g.t}}</span>
</span>
</button>
</sc-for>
</div>
</div>
</section>

<sc-if value="{{hasOpen}}" hint-placeholder-val="{{false}}">
<div role="dialog" aria-modal="true" aria-label="{{cur.t}}" style="position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; box-sizing: border-box">
<button type="button" onClick="{{close}}" aria-label="Close" style="position: absolute; top: 16px; right: 16px; width: 48px; height: 48px; border-radius: 50%; border: none; background: #FFFFFF; color: #111111; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
<img src="{{cur.src}}" alt="{{cur.t}}" style="max-width: 100%; max-height: 74vh; object-fit: contain; border-radius: 6px; display: block">
<div style="display: flex; align-items: center; gap: 16px; color: #FFFFFF">
<button type="button" onClick="{{prev}}" aria-label="Previous photo" style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid #FFFFFF; background: none; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<span style="font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 16px; text-align: center; min-width: 220px">{{cur.t}} <span style="color: #BDBDBD; font-weight: 600">· {{pos}}</span></span>
<button type="button" onClick="{{next}}" aria-label="Next photo" style="width: 48px; height: 48px; border-radius: 50%; border: 2px solid #FFFFFF; background: none; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
</sc-if>

<section style="padding: 72px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 32px; align-items: center">
<div style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; font-family: 'Montserrat', sans-serif; font-size: clamp(26px, 2.8vw, 34px); font-weight: 800; color: #111111">Like what you see?</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.6; color: #555555">Tell us about your project and we'll set up a free consultation.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px">
<a href="Quote.dc.html" style="background: #DC1A21; color: #FFFFFF; text-decoration: none; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 16px; padding: 16px 28px; border-radius: 4px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center">Get a Free Quote</a>
<a href="tel:7274946162" style="border: 2px solid #111111; color: #111111; text-decoration: none; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 16px; padding: 14px 26px; border-radius: 4px; min-height: 52px; box-sizing: border-box; display: inline-flex; align-items: center">Call (727) 494-6162</a>
</div>
</div>
</section>

<dc-import name="Footer" hint-size="100%,420px"></dc-import>
</div>
</x-dc>
